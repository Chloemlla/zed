name: Release (zh-CN)

# Multi-platform build and GitHub Release for this Simplified Chinese fork, on
# the same three triggers as the meatshell pipeline:
#
#  - push a tag like `v1.21.0-zh.1` -> builds every platform and attaches the
#    bundles to the GitHub Release for that tag;
#  - push to `main`                 -> real-time multi-platform build, and when
#    all of them succeed the bundles are published straight away as the
#    official release of the version in `crates/zed/Cargo.toml`: tagged
#    `v<version>`, named after that version and marked "Latest". A second push
#    without a version bump updates that same release (assets are overwritten),
#    so "Latest" always points at the newest successful build of `main`.
#  - run manually (workflow_dispatch) -> builds every platform and keeps the
#    bundles as downloadable workflow artifacts, without creating a release.
#
# Every build compiles with the `stable` release channel, so the app presents
# itself as "Zed" (not "Zed Dev"/"Zed Devel") with the stable icons and bundle
# identifiers: these are official release binaries, not dev builds. Auto-updates
# are compiled out via ZED_UPDATE_EXPLANATION, because a stable-channel build
# would otherwise poll zed.dev and replace this fork with upstream Zed.
#
# Zed's own release pipeline only runs for the zed-industries owner, on
# Namespace runners, and it needs Zed's code-signing and blob-store credentials.
# This workflow builds on plain GitHub-hosted runners instead, but drives the
# very same `script/bundle-*` entry points, so the artifacts are shaped like
# upstream's. Without signing credentials `script/bundle-mac` falls back to
# ad-hoc signing, so the first launch of a .dmg needs right-click > Open.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create and update the GitHub Release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    # The release tag, the release name and the commit list are computed once
    # here and handed to every job that publishes, so all platforms release the
    # very same thing.
    outputs:
      version: ${{ steps.project.outputs.version }}
      changelog: ${{ steps.commits.outputs.changelog }}
      tag: ${{ steps.project.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit list below walks the history back to the previous tag, so
          # this clone cannot be shallow.
          fetch-depth: 0

      # An already pushed tag is what will be released, otherwise the version in
      # the zed crate is released as `v<version>`.
      - name: Read the zed crate version
        id: project
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -n 1)"
          [ -n "$VERSION" ] || { echo "could not read the zed crate version"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      # Every release body lists the commits it was built from: a tag lists
      # everything since the previous tag, a branch push everything the push
      # brought in, a manual run the newest commits of the checked out revision.
      - name: Collect commits
        id: commits
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          RANGE=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # `git describe` on the parent skips the tag being released itself.
            PREVIOUS="$(git describe --tags --abbrev=0 "${AFTER}^" 2>/dev/null || true)"
            if [ -n "$PREVIOUS" ] && git merge-base --is-ancestor "$PREVIOUS" "$AFTER"; then
              RANGE="${PREVIOUS}..${AFTER}"
            fi
          fi
          if [ -z "$RANGE" ] && [ -n "${BEFORE:-}" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          fi
          if [ -z "$RANGE" ]; then
            # No usable range: first tag of the repository, or a force push that
            # orphaned the previous head. Fall back to the newest commits.
            BASE="$(git rev-parse "${AFTER}~50" 2>/dev/null || true)"
            if [ -n "$BASE" ]; then RANGE="${BASE}..${AFTER}"; else RANGE="$AFTER"; fi
          fi
          COUNT="$(git rev-list --count "$RANGE")"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "### 本次构建包含的提交（共 ${COUNT} 条）"
            echo
            git log --max-count=200 --pretty=format:'- %s (`%h`)' "$RANGE"
            if [ "$COUNT" -gt 200 ]; then
              echo
              echo
              echo "（提交较多，仅列出最近 200 条）"
            fi
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # A fork tag carries a suffix after the upstream version, so that the same
      # Zed revision can be released more than once: v1.21.0, v1.21.0-zh.1, ...
      - name: Ensure tag matches the version of the zed crate
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="${{ steps.project.outputs.version }}"
          LOCK_VERSION="$(awk '
            $0 == "name = \"zed\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          case "$TAG_VERSION" in
            "$CARGO_VERSION"|"$CARGO_VERSION"-*) ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not start with the zed crate version ${CARGO_VERSION}."
              echo "Use v${CARGO_VERSION} or v${CARGO_VERSION}-<suffix>."
              exit 1
              ;;
          esac
          if [ "$CARGO_VERSION" != "$LOCK_VERSION" ]; then
            echo "Cargo.lock pins zed ${LOCK_VERSION}, but crates/zed/Cargo.toml says ${CARGO_VERSION}."
            echo "Commit the lock file update before tagging."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    # Zed is ~250 crates and ~1500 dependencies; a cold release build on a
    # 4-vCPU runner takes hours, so do not let the default 360 minutes clip it.
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bundle: windows
            target: x86_64-pc-windows-msvc
          # Build Linux on the oldest supported runner, for a low glibc baseline.
          - name: linux-x86_64
            os: ubuntu-22.04
            bundle: linux
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm # free native arm64 runner (public repos).
            # Not interchangeable with 22.04: Livekit's prebuilt libwebrtc.a for
            # arm64 is built with GCC 14 and references __arm_tpidr2_save, the
            # FEAT_THE based 128-bit atomic helper that only libatomic from GCC
            # 14 (Ubuntu 24.04) provides; lld on 22.04 fails the final link.
            # The arm64 binary therefore needs glibc >= 2.39, while x86_64 keeps
            # the low 22.04 baseline.
            bundle: linux
            arch: aarch64
          - name: macos-aarch64
            os: macos-latest
            bundle: mac
            target: aarch64-apple-darwin
            dmg: Zed-aarch64.dmg
          - name: macos-x86_64
            os: macos-latest # cross-compiled on Apple Silicon, like upstream does
            bundle: mac
            target: x86_64-apple-darwin
            dmg: Zed-x86_64.dmg
    steps:
      - uses: actions/checkout@v4

      # These jobs publish official releases, so they must not compile as `dev`:
      # the channel is baked into the binary from this file (see
      # `release_channel::compile_time_release_channel_name`), and `dev` names the
      # app "Zed Dev"/"Zed Devel", ships the dev icon and claims the dev bundle
      # identifier. Upstream's nightly workflow rewrites this very same file to
      # `nightly` before building.
      - name: Set release channel to stable
        shell: bash
        run: |
          set -eu
          echo "stable" > crates/zed/RELEASE_CHANNEL
          cat crates/zed/RELEASE_CHANNEL

      # Zed's checkout blows through Windows' 260 character path limit.
      - name: Enable long paths (Windows)
        if: matrix.bundle == 'windows'
        shell: powershell
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      # script/linux installs the toolchain-adjacent packages Zed links against
      # (alsa, fontconfig, libgit2, openssl, zstd, lld for aarch64, ...) plus
      # rustup itself, which is what the pinned rust-toolchain.toml needs.
      - name: Install Linux build dependencies
        if: matrix.bundle == 'linux'
        shell: bash
        run: |
          set -eu
          ./script/linux
          ./script/download-wasi-sdk
          # libwebrtc needs a clang with usable C++20 support; upstream builds
          # with clang-18 and passes it through CC/CXX below.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18

      # script/bundle-mac dresses the .dmg with a license pane through npm.
      - name: Set up Node (macOS)
        if: matrix.bundle == 'mac'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      # webrtc-sys' cxxbridge headers do not compile against the libc++ that
      # ships with Xcode 15.x: every translation unit dies on
      # `implicit instantiation of undefined template
      # 'std::__pointer_traits_element_type<rust::Slice<...>::iterator>'`
      # in the SDK's pointer_traits.h. Pick the newest Xcode the image offers
      # instead of trusting the image default.
      - name: Select Xcode (macOS)
        if: matrix.bundle == 'mac'
        shell: bash
        run: |
          set -eu
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "switching to ${latest}"
          sudo xcode-select --switch "${latest}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Clear target directory if large
        if: matrix.bundle != 'windows'
        shell: bash
        run: ./script/clear-target-dir-if-larger-than 100 70

      # Only the downloaded crates are worth caching here: Zed's own `target/`
      # grows far past GitHub's 10GB per-cache limit, so archiving it would burn
      # tens of minutes on every run to save nothing.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-targets: false

      # Zed has neither the telemetry checksum seed nor a Sentry endpoint for a
      # fork build; both are read through `option_env!` and guarded by
      # `is_some()`, so leaving them out only turns telemetry off.
      - name: Build (Linux)
        if: matrix.bundle == 'linux'
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
          # `windows_resources`/`release_channel` read RELEASE_CHANNEL at compile
          # time, and the app product version is built from it.
          RELEASE_CHANNEL: stable
          # Compile-time switch (the same one nix builds use) that disables
          # auto-update polling: a stable-channel build otherwise asks zed.dev
          # for upstream Zed and would silently replace this fork.
          ZED_UPDATE_EXPLANATION: "本版本为 Zed 汉化版，不支持自动更新，请到 https://github.com/Chloemlla/zed/releases/latest 下载新版本。"
        run: ./script/bundle-linux

      # bundle-mac installs the pinned cargo-bundle fork itself when the version
      # does not match, and ad-hoc signs the app when no certificate is present.
      - name: Build (macOS)
        if: matrix.bundle == 'mac'
        shell: bash
        env:
          RELEASE_CHANNEL: stable
          ZED_UPDATE_EXPLANATION: "本版本为 Zed 汉化版，不支持自动更新，请到 https://github.com/Chloemlla/zed/releases/latest 下载新版本。"
        run: ./script/bundle-mac ${{ matrix.target }}

      # Upstream runs script/bundle-windows.ps1 here, which additionally needs
      # Inno Setup, the AGS SDK, ConPTY and code-signing credentials. The
      # editor and the `zed` launcher are what a release needs, so build those
      # with the same cargo config and the same package list the script uses.
      - name: Build (Windows)
        if: matrix.bundle == 'windows'
        shell: bash
        env:
          RELEASE_CHANNEL: stable
          ZED_UPDATE_EXPLANATION: "本版本为 Zed 汉化版，不支持自动更新，请到 https://github.com/Chloemlla/zed/releases/latest 下载新版本。"
        run: cargo --config .cargo/bundle-config.toml build --release --package zed --package cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-main}"
          rm -rf dist
          mkdir -p dist

          case "${{ matrix.bundle }}" in
            linux)
              arch="${{ matrix.arch }}"
              cp "target/release/zed-linux-${arch}.tar.gz" \
                "dist/zed-${VERSION}-${{ matrix.name }}.tar.gz"
              cp "target/zed-remote-server-linux-${arch}.gz" \
                "dist/zed-remote-server-${VERSION}-linux-${arch}.gz"
              ;;
            mac)
              arch="${{ matrix.target }}"
              arch="${arch%%-*}"
              cp "target/${{ matrix.target }}/release/${{ matrix.dmg }}" \
                "dist/zed-${VERSION}-${{ matrix.name }}.dmg"
              cp "target/zed-remote-server-macos-${arch}.gz" \
                "dist/zed-remote-server-${VERSION}-macos-${arch}.gz"
              ;;
            windows)
              stage="zed-${VERSION}-${{ matrix.name }}"
              rm -rf "$stage"
              mkdir -p "$stage"
              cp "target/${{ matrix.target }}/release/zed.exe" "$stage/"
              cp "target/${{ matrix.target }}/release/cli.exe" "$stage/zed-cli.exe"
              cp README.md LICENSE-APACHE LICENSE-GPL "$stage/"
              7z a "${stage}.zip" "$stage" >/dev/null
              mv "${stage}.zip" "dist/"
              ;;
          esac

          echo "Bundled artifacts:"
          ls -lh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          # A fork tag is the official release of that build, so it is never a
          # prerelease and is allowed to take over the "Latest" badge.
          prerelease: false
          make_latest: true
          # The body is identical in every platform job, so the concurrent
          # updates cannot disagree.
          name: "Zed 汉化版 ${{ needs.check-version.outputs.version }}"
          body: |
            Zed 汉化版 ${{ needs.check-version.outputs.version }} 正式版（stable 发布渠道，非 dev 构建）。

            - 构建提交：`${{ github.sha }}`
            - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 安装包见下方 Assets（Windows / macOS / Linux，x86_64 与 aarch64）

            ${{ needs.check-version.outputs.changelog }}

  # Publishing step for real-time builds on `main`: collect every platform
  # bundle and publish them immediately as the official release of the version
  # currently in `crates/zed/Cargo.toml` - tag `v<version>`, marked "Latest",
  # neither a draft nor a prerelease. Re-running it for the same version updates
  # that same release and overwrites its assets, which keeps "Latest" on the
  # newest successful `main` build. Tag pushes keep their own release path, and
  # manual dispatches stay artifact-only.
  publish-release:
    name: publish-release
    needs: [check-version, build]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Flatten artifacts into release assets
        shell: bash
        run: |
          set -eu
          mkdir -p release-assets
          find ci-artifacts -type f -exec cp -n {} release-assets/ \;
          # Branch builds are packaged as "zed-main-..."; relabel them with the
          # real version so download names match the release tag.
          cd release-assets
          for file in zed-main-*; do
            [ -e "$file" ] || continue
            mv "$file" "zed-${{ needs.check-version.outputs.version }}-${file#zed-main-}"
          done
          echo "Assembled release assets:"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.tag }}
          # Creates the `v<version>` tag on the very commit that was built, even if
          # `main` has moved on while the builds were running.
          target_commitish: ${{ github.sha }}
          name: "Zed 汉化版 ${{ needs.check-version.outputs.version }}"
          body: |
            Zed 汉化版 ${{ needs.check-version.outputs.version }} 正式版（stable 发布渠道，非 dev 构建）。

            - 构建提交：`${{ github.sha }}`
            - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 安装包见下方 Assets（Windows / macOS / Linux，x86_64 与 aarch64）

            同一版本号再次构建会覆盖更新本 Release 的 Assets，"Latest" 始终指向 main 上最新一次成功的构建。

            ${{ needs.check-version.outputs.changelog }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: release-assets/*
